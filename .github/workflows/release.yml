name: release

# On-demand only. The desktop app and the server are released separately, each
# from its own tag, so a change to one never puts out a version of the other:
#
#   git tag desktop-v0.4.0 && git push origin desktop-v0.4.0   # installers + update feed
#   git tag server-v0.3.1  && git push origin server-v0.3.1    # server bundle
#
# Ordinary commits to main build nothing. See docs/DISTRIBUTION.md.
#
# workflow_dispatch is a dry run of the server bundle alone: it builds and
# uploads the zip as a workflow artifact, publishing nothing. Use it to check the
# bundle still assembles without spending a version number to find out.
on:
  push:
    tags:
      - 'desktop-v*'
      - 'server-v*'
  workflow_dispatch:

# Never run two release builds for the same tag at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: write # create the release + upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg (Intel + Apple Silicon). The site's asset matcher
          # picks the first .dmg, and browsers can't reliably detect Mac arch —
          # a single universal binary sidesteps both problems.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # The tag names the version the update feed announces; the installers are
      # stamped from tauri.conf.json. If they differ, installed apps would be
      # offered an "update" to the version they already run, forever.
      - name: Check the tag matches the app version
        shell: bash
        run: |
          app="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          if [[ "desktop-v$app" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Installs every workspace (api/desktop/web); the desktop build only needs
      # its own deps, but pnpm resolves the whole workspace at once.
      - run: pnpm install --frozen-lockfile

      # The signing key signs the update bundles, and installed apps accept an
      # update only if it verifies against the public key in tauri.conf.json.
      # Losing the key means no installed app can ever be updated again.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Cloak desktop ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Finishes the desktop release once every platform has uploaded: notes that
  # cover changes since the previous app release (not whichever release came
  # last), the oldest server the new version works with, and "latest" status.
  # Installed apps read latest.json from GitHub's latest release, so a server
  # release must never hold that spot.
  desktop-feed:
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write release notes since the previous app release
        run: |
          set -euo pipefail
          previous="$(scripts/previous-release-tag.sh desktop "$TAG")"
          args=(-f tag_name="$TAG")
          [[ -n "$previous" ]] && args+=(-f previous_tag_name="$previous")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Publish the update feed
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern latest.json --clobber
          min_server="$(jq -r .min_server_version desktop/src/compat.json)"
          jq --arg min "$min_server" --rawfile notes notes.md \
            '.min_server_version = $min | .notes = $notes' latest.json > feed.json
          mv feed.json latest.json
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --latest

  # The self-hosted backend, shipped as its own asset so an operator can set up
  # a server without cloning the repository or installing pnpm. Runs after the
  # installers so it attaches to a release that already exists.
  server-bundle:
    if: startsWith(github.ref, 'refs/tags/server-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous server tag, for the release notes

      # A server reports SERVER_VERSION to every app that connects, and the apps
      # compare it with their own bounds, so it has to be the version released.
      - name: Check the tag matches the server version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package="$(node -p "require('./api/package.json').version")"
          reported="$(sed -nE "s/^export const SERVER_VERSION = '([^']+)';/\1/p" api/src/lib/version.ts)"
          if [[ "server-v$package" != "$GITHUB_REF_NAME" || "$reported" != "$package" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME, api/package.json $package and SERVER_VERSION $reported must agree"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The npm bundled with Node 22 (10.9.8) cannot resolve this dependency
      # tree from scratch — its peer-set walk dies with "Cannot read properties
      # of null (reading 'edgesOut')". Same pin as the Dockerfile.
      - run: npm install -g npm@11

      - name: Build the API
        working-directory: api
        run: |
          # npm, not pnpm: the bundle has to install with the tooling an
          # operator already has, and api/ has no workspace dependencies.
          npm install --ignore-scripts
          npm run build

      - name: Assemble the bundle
        working-directory: api
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          OUT="cloak-server-v${VERSION}"
          mkdir -p "../$OUT"

          # A lockfile so `npm ci` on the operator's machine resolves exactly
          # what was tested here, including the security overrides.
          npm install --package-lock-only --ignore-scripts

          # dist for the pm2 path (no build step needed), src for the Docker
          # path (its builder stage compiles) and for anyone who wants to read
          # or patch what they are running.
          cp -r dist src templates "../$OUT/"
          cp package.json package-lock.json tsconfig.json "../$OUT/"
          cp Dockerfile docker-compose.yml docker-compose.tls.yml Caddyfile "../$OUT/"
          cp setup.sh .env.example ecosystem.config.cjs README.md "../$OUT/"
          chmod +x "../$OUT/setup.sh"

          cd ..
          zip -r "$OUT.zip" "$OUT"
          sha256sum "$OUT.zip" > "$OUT.zip.sha256"
          echo "BUNDLE=$OUT.zip" >> "$GITHUB_ENV"
          echo "Built $OUT.zip for $VERSION"

      # Never marked latest: installed apps take their update feed from the
      # latest release, and a server release has none.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          previous="$(scripts/previous-release-tag.sh server "$GITHUB_REF_NAME")"
          args=(--title "Cloak server ${GITHUB_REF_NAME}" --generate-notes --latest=false --verify-tag)
          [[ -n "$previous" ]] && args+=(--notes-start-tag "$previous")
          gh release create "$GITHUB_REF_NAME" "$BUNDLE" "$BUNDLE.sha256" "${args[@]}"

      # Dry run: keep the zip for inspection instead of publishing it.
      - name: Upload as a build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cloak-server-dry-run
          path: |
            ${{ env.BUNDLE }}
            ${{ env.BUNDLE }}.sha256
          retention-days: 7
