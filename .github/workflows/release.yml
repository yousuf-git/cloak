name: release

# On-demand only: builds + publishes a GitHub Release when a version tag is
# pushed (e.g. `git tag v0.2.0 && git push origin v0.2.0`). Ordinary commits to
# main build nothing. See docs/DISTRIBUTION.md.
on:
  push:
    tags:
      - 'v*'

# Never run two release builds for the same tag at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # create the release + upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg (Intel + Apple Silicon). The site's asset matcher
          # picks the first .dmg, and browsers can't reliably detect Mac arch —
          # a single universal binary sidesteps both problems.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Installs every workspace (api/desktop/web); the desktop build only needs
      # its own deps, but pnpm resolves the whole workspace at once.
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Cloak ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

  # The self-hosted backend, shipped as its own asset so an operator can set up
  # a server without cloning the repository or installing pnpm. Runs after the
  # installers so it attaches to a release that already exists.
  server-bundle:
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the API
        working-directory: api
        run: |
          # npm, not pnpm: the bundle has to install with the tooling an
          # operator already has, and api/ has no workspace dependencies.
          npm install --ignore-scripts
          npm run build

      - name: Assemble the bundle
        working-directory: api
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="cloak-server-${GITHUB_REF_NAME}"
          mkdir -p "../$OUT"

          # A lockfile so `npm ci` on the operator's machine resolves exactly
          # what was tested here, including the security overrides.
          npm install --package-lock-only --ignore-scripts

          # dist for the pm2 path (no build step needed), src for the Docker
          # path (its builder stage compiles) and for anyone who wants to read
          # or patch what they are running.
          cp -r dist src templates "../$OUT/"
          cp package.json package-lock.json tsconfig.json "../$OUT/"
          cp Dockerfile docker-compose.yml docker-compose.tls.yml Caddyfile "../$OUT/"
          cp setup.sh .env.example ecosystem.config.cjs README.md "../$OUT/"
          chmod +x "../$OUT/setup.sh"

          cd ..
          zip -r "$OUT.zip" "$OUT"
          sha256sum "$OUT.zip" > "$OUT.zip.sha256"
          echo "BUNDLE=$OUT.zip" >> "$GITHUB_ENV"
          echo "Built $OUT.zip for $VERSION"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${BUNDLE}" "${BUNDLE}.sha256" --clobber
