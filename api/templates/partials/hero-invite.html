<!--
  Invitation hero. The org and the role outrank the token here: the reader is
  deciding whether to accept before they care what to paste. Token sits beneath
  as the mechanism, in a readout block — per-character cells suit a 6-digit code,
  not 43 characters of base64url.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#121620" style="background-color:#121620;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,0.020) 0px,rgba(255,255,255,0.020) 1px,rgba(255,255,255,0) 1px,rgba(255,255,255,0) 3px),radial-gradient(120% 150% at 10% -10%,rgba(128,103,207,0.30) 0%,rgba(128,103,207,0.06) 46%,rgba(128,103,207,0) 68%),linear-gradient(180deg,#1a1f2c 0%,#121722 55%,#0d1119 100%);border-bottom:1px solid #262b36;">
  <tr>
    <td style="padding:26px 34px 28px;">

      <div style="font-family:'JetBrains Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#a78bfa;padding-bottom:14px;">
        {{codeLabel}}
      </div>

      <div style="font-family:'Space Grotesk','Avenir Next','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-0.9px;color:#f4f5f7;padding-bottom:12px;">
        {{orgName}}
      </div>

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:20px;">
        <tr>
          <td bgcolor="#1c1630" style="background-color:#1c1630;background-image:linear-gradient(180deg,#2a2050 0%,#191331 100%);border:1px solid #4a3b7d;border-top-color:#6b55ad;padding:5px 11px;font-family:'JetBrains Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#a78bfa;">
            Role &middot; {{role}}
          </td>
        </tr>
      </table>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#080a0e" style="background-color:#080a0e;background-image:linear-gradient(180deg,#141a25 0%,#0a0d13 100%);border:1px solid #333b4d;border-top-color:#4a5468;">
        <tr>
          <td style="padding:9px 14px;border-bottom:1px solid #1e222b;font-family:'JetBrains Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;letter-spacing:2.4px;text-transform:uppercase;color:#5a606b;">
            Invitation code &nbsp;&middot;&nbsp; {{codeCaption}}
          </td>
        </tr>
        <tr>
          <td style="padding:14px;font-family:'JetBrains Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:23px;color:#f4f5f7;word-break:break-all;">{{code}}</td>
        </tr>
      </table>

    </td>
  </tr>
</table>
